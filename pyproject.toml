[project]
name = "filings-rag"
version = "0.1.0"
description = "Ask questions about SEC 10-K filings: hybrid pgvector retrieval, cited answers, and RAGAS evaluations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "httpx>=0.27",
  "selectolax>=1.0",
  "fastembed>=0.5",
  "anthropic>=0.40",
  "openai>=1.50",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
evals = ["ragas>=0.4", "langchain-community>=0.3,<0.4", "langchain-anthropic>=0.3", "langchain-openai>=0.2", "pandas>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
filings-rag = "filings_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
